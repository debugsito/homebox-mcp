# Compose de desarrollo, para levantar solo la API contra un HomeBox externo.
# El despliegue real vive en el servidor, junto a HomeBox y Caddy.
services:
  api:
    build:
      context: .
      target: runtime
    container_name: inventory-ai-api
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - 127.0.0.1:3000:3000
    restart: unless-stopped
